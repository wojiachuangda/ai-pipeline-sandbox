[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-app"
version = "0.1.0"
description = "AI agent platform — domain skeleton, health probes, and extensible API scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["starlette[standard]>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
